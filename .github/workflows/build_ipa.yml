name: Build iOS Native IPA (SideStore & AltStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Compilar App Nativa SwiftUI (.ipa para SideStore)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compilar Binario Nativo iOS (SwiftUI arm64) y Empaquetar .ipa
        working-directory: MisFinanzasiOS
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Usando iOS SDK: $SDK_PATH"

          rm -rf Payload MisFinanzas.ipa
          mkdir -p Payload/MisFinanzas.app

          if ! xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            Sources/MisFinanzasApp.swift \
            Sources/Models/FinanzasModels.swift \
            Sources/Services/FinanzasViewModel.swift \
            Sources/Views/MainTabView.swift \
            Sources/Views/ResumenView.swift \
            Sources/Views/QuincenaView.swift \
            Sources/Views/DeudasView.swift \
            Sources/Views/MetasView.swift \
            -o Payload/MisFinanzas.app/MisFinanzas 2> build_err.log; then
              cat build_err.log
              ERR_MSG=$(cat build_err.log | tr '\n' ' ')
              echo "::error::$ERR_MSG"
              exit 1
          fi

          chmod +x Payload/MisFinanzas.app/MisFinanzas
          cp Sources/Info.plist Payload/MisFinanzas.app/Info.plist
          plutil -convert binary1 Payload/MisFinanzas.app/Info.plist
          echo -n "APPL????" > Payload/MisFinanzas.app/PkgInfo

          codesign --force --deep --sign - Payload/MisFinanzas.app
          zip -r9 MisFinanzas.ipa Payload
          ls -lh MisFinanzas.ipa

      - name: Subir Artifact MisFinanzas.ipa
        uses: actions/upload-artifact@v4
        with:
          name: MisFinanzas-SideStore-IPA
          path: MisFinanzasiOS/MisFinanzas.ipa

      - name: Publicar en GitHub Releases (Descarga directa desde iPhone para SideStore)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Mis Finanzas iOS v1.0.${{ github.run_number }} (SideStore IPA)"
          body: "Descarga `MisFinanzas.ipa` directamente en tu iPhone y ábrelo en **SideStore** (pestaña My Apps -> botón `+`)."
          files: MisFinanzasiOS/MisFinanzas.ipa
