name: MisFinanzas
options:
  bundleIdPrefix: com.andres
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    PRODUCT_NAME: MisFinanzas
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Sources/Info.plist

targets:
  MisFinanzas:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andres.misfinanzas
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
